# MongoDB only:        docker compose up -d mongo
# MongoDB + API:       docker compose up -d --build
# Seed (API running):  docker compose exec api node scripts/seed.js
services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    profiles: ["full"]
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development # allows demo login + seeding; use production with real secrets
      MONGODB_URI: mongodb://mongo:27017/feedants
      JWT_SECRET: docker-dev-secret
      PUBLIC_BASE_URL: http://localhost:4000
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
